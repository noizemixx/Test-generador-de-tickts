<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TicketFlow | Nuevo ticket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">
          <span class="brand-mark">T</span>
          <span>TicketFlow</span>
        </a>
        <nav class="top-nav"><a href="{{ url_for('tickets') }}">Tickets guardados</a></nav>
      </header>

      <section class="hero">
        <p class="eyebrow">Mesa de ayuda</p>
        <h1>Generador de tickets</h1>
        <p class="hero-copy">Registra una solicitud y conserva su historial de cambios.</p>
      </section>

      <section class="workspace single-column">
        <form class="card form-card" method="post">
          <div class="card-heading">
            <div>
              <p class="section-kicker">Nueva solicitud</p>
              <h2>Cuéntanos qué necesitas</h2>
            </div>
          </div>
          {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
          <div class="field-grid">
            <label>
              Solicitante
              <input name="requester" type="text" placeholder="Ej. Ana García" required value="{{ request.form.get('requester', '') }}">
            </label>
            <label>
              Correo electrónico
              <input name="email" type="email" placeholder="ana@empresa.com" required value="{{ request.form.get('email', '') }}">
            </label>
          </div>
          <div class="field-grid">
            <label>
              Categoría
              <select name="category">
                {% for option in categories %}
                  <option value="{{ option }}" {% if request.form.get('category', 'Soporte') == option %}selected{% endif %}>{{ option }}</option>
                {% endfor %}
              </select>
            </label>
            <label>
              Prioridad
              <select name="priority">
                {% for value, label in [("baja", "Baja"), ("media", "Media"), ("alta", "Alta"), ("critica", "Crítica")] %}
                  <option value="{{ value }}" {% if request.form.get('priority', 'media') == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </label>
          </div>
          <label>
            Asunto
            <input name="subject" type="text" placeholder="Resume tu solicitud en una frase" required value="{{ request.form.get('subject', '') }}">
          </label>
          <label>
            Descripción
            <textarea name="description" rows="6" placeholder="Añade los detalles que ayudarán a resolverla..." required>{{ request.form.get('description', '') }}</textarea>
          </label>
          <button class="primary-button" type="submit">Guardar ticket <span aria-hidden="true">→</span></button>
        </form>
      </section>
      <footer>TicketFlow · Tickets e historial almacenados localmente</footer>
    </main>
  </body>
</html>
