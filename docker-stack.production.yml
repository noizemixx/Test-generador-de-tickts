services:
  web:
    image: ${TICKETFLOW_IMAGE:?Set TICKETFLOW_IMAGE to a published registry image}
    ports:
      - "5000:5000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD_FILE: /run/secrets/ticketflow_db_password
    secrets:
      - ticketflow_db_password
    networks:
      - ticketflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD_FILE: /run/secrets/ticketflow_db_password
    secrets:
      - ticketflow_db_password
    volumes:
      - ticketflow_postgres_data:/var/lib/postgresql/data
    networks:
      - ticketflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.ticketflow.postgres == true
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  ticketflow:
    driver: overlay

volumes:
  ticketflow_postgres_data:
    name: ticketflow_postgres_data

secrets:
  ticketflow_db_password:
    external: true
